<style>
html{scroll-behavior:smooth}
body{margin:0;background:#0A0A0C}
a{color:#7C5CFF}a:hover{color:#6A48F0}
.vbtn{transition:transform .2s ease,box-shadow .2s ease,background-color .2s ease,border-color .2s ease;cursor:pointer}

.vtile:hover{transform:translateY(-6px);border-color:#7C5CFF !important;box-shadow:0 24px 48px -28px rgba(124,92,255,.55)}
.vshot{transition:transform .45s ease}
.vcard:hover .vshot{transform:translateY(-6px) scale(1.01)}
.vrow{transition:background-color .25s ease}
.vrow:hover{background:#F4F4F6}
.vfoot a{color:#A1A1AA;text-decoration:none}
.vfoot a:hover{color:#FFFFFF}
.vfaq-q{transition:background-color .2s ease}
.vfaq-q:hover{background:#F4F4F6}
input,select,textarea{font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid #7C5CFF;outline-offset:1px}
@keyframes vup{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.vup{animation:vup .9s cubic-bezier(.2,.7,.2,1) both}
.vup2{animation:vup .9s .15s cubic-bezier(.2,.7,.2,1) both}
.vup3{animation:vup 1s .3s cubic-bezier(.2,.7,.2,1) both}
@keyframes vfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.vfloat{animation:vfloat 6s ease-in-out infinite}
.vmenu-btn{display:none}
@media (max-width:640px){.vfab{left:16px !important;right:16px !important;bottom:16px !important;justify-content:center}}
.vind-more{transition:gap .25s ease}
.vtile:hover .vind-more{gap:12px !important}
@keyframes vpulse{0%,100%{opacity:1}50%{opacity:.35}}
.vpulse{animation:vpulse 1.6s ease-in-out infinite}
@media (max-width:860px){.vnavlinks{display:none !important}.vhide-sm{display:none !important}.vmenu-btn{display:flex !important}.vnav-cta{display:none !important}}
@media (max-width:640px){

.vm-hero{padding:56px 20px 72px !important;gap:40px !important}

.vm-price{font-size:64px !important}
.vm-full{width:100% !important;justify-content:center !important;box-sizing:border-box !important}
.vm-faqq{font-size:17px !important;padding:20px 4px !important}
.vm-faqa{padding:0 8px 22px 4px !important}
.vm-form{padding:26px 20px !important}
.vm-bar{font-size:12px !important}
.vm-badge{left:0 !important}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important;scroll-behavior:auto !important}}
</style>

<!-- 9. ABOUT VERO -->
<section id="about" style="background: #F4F4F6; padding: 130px 24px">
<div style="max-width: 1240px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 56px 72px; align-items: stretch">
<div style="flex: 1 1 440px; min-width: 0; display: flex; flex-direction: column">

<p style="font-size: 18px; line-height: 1.7; color: #5B5B66; margin: 26px 0 0">At VERO, we believe every business deserves a professional online presence. We create modern, custom websites that help local businesses showcase their services, build trust, and connect with more customers.</p>
<p style="font-size: 18px; line-height: 1.7; color: #5B5B66; margin: 18px 0 0">The trades are built on reputation, and today that reputation starts online. We design every site around the way your customers actually decide who to call.</p>
<div style="margin-top: 36px; padding: 26px 0 0 26px; border-left: 3px solid #7C5CFF">
<p style="font-family: 'Space Grotesk', sans-serif; font-size: clamp(22px, 2vw, 28px); line-height: 1.3; font-weight: 600; margin: 0">“Your website is often the first thing a customer sees. We make sure it shows the quality of the work you do.”</p>
<div style="display: flex; align-items: center; gap: 12px; margin-top: 18px; font-size: 14px; color: #5B5B66"><img src="images/vero-mark.png" alt="" style="height: 18px; width: auto; filter: invert(1) brightness(0.25)">The VERO Digital promise</div>
</div>
<div style="flex: 1; min-height: 28px"></div>
<a class="vbtn vbtn-primary" href="book.html#book" style="align-self: flex-start; margin-top: 12px; background: #7C5CFF; color: #FFFFFF; text-decoration: none; font-weight: 600; font-size: 16px; padding: 16px 28px; border-radius: 999px; display: inline-flex; align-items: center; gap: 10px">Work With VERO <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
</div>
<div style="flex: 1.15 1 480px; min-width: 0; background: #0A0A0C; color: #FFFFFF; border-radius: 28px; padding: clamp(32px, 4vw, 52px); position: relative; overflow: hidden">
<img src="images/vero-mark.png" alt="" aria-hidden="true" style="position: absolute; right: -60px; top: -40px; width: 380px; height: auto; opacity: 0.07">
<div aria-hidden="true" style="position: absolute; width: 460px; height: 460px; left: -200px; bottom: -260px; border-radius: 50%; background: radial-gradient(circle, rgba(124,92,255,0.4), rgba(124,92,255,0) 65%)"></div>
<div style="position: relative">
<div style="font-size: 13px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #A99BFF">What we stand for</div>
<ol style="list-style: none; padding: 0; margin: 28px 0 0">
<li style="display: flex; gap: 24px; padding: 26px 0; border-top: 1px solid rgba(196,190,230,0.16)"><span style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 15px; color: #A99BFF; width: 28px; flex-shrink: 0">01</span><div><h3 style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; margin: 0">Our mission</h3><p style="color: #A1A1AA; line-height: 1.6; margin: 8px 0 0">Give local businesses a website that looks as professional as the work they do, at a price that makes sense.</p></div></li>
<li style="display: flex; gap: 24px; padding: 26px 0; border-top: 1px solid rgba(196,190,230,0.16)"><span style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 15px; color: #A99BFF; width: 28px; flex-shrink: 0">02</span><div><h3 style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; margin: 0">Our design philosophy</h3><p style="color: #A1A1AA; line-height: 1.6; margin: 8px 0 0">Clean, purposeful design with no templates. Every layout is built around your services, your customers and your brand.</p></div></li>
<li style="display: flex; gap: 24px; padding: 26px 0; border-top: 1px solid rgba(196,190,230,0.16)"><span style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 15px; color: #A99BFF; width: 28px; flex-shrink: 0">03</span><div><h3 style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; margin: 0">Our commitment to quality</h3><p style="color: #A1A1AA; line-height: 1.6; margin: 8px 0 0">Careful typography, optimized images and testing on every screen size before anything goes live.</p></div></li>
<li style="display: flex; gap: 24px; padding: 26px 0 0; border-top: 1px solid rgba(196,190,230,0.16)"><span style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 15px; color: #A99BFF; width: 28px; flex-shrink: 0">04</span><div><h3 style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; margin: 0">Our focus on local businesses</h3><p style="color: #A1A1AA; line-height: 1.6; margin: 8px 0 0">We specialize in HVAC, roofing, plumbing, electrical, landscaping and construction, so we know what your customers look for.</p></div></li>

<!-- 6. WHY CHOOSE VERO -->
<section id="why" style="background: #FFFFFF; padding: 130px 24px">

<div style="flex: 1 1 380px; min-width: 0">
<div style="font-size: 14px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #7C5CFF">Why choose VERO</div>
<h2 style="font-family: 'Space Grotesk', sans-serif; font-size: clamp(36px, 4.4vw, 58px); line-height: 1.04; letter-spacing: -0.03em; margin: 16px 0 0">A creative studio's quality, at a local business price.</h2>
<p style="font-size: 18px; line-height: 1.65; color: #5B5B66; margin: 24px 0 0">VERO makes professional websites simple and affordable. You get a site designed around your business, built properly, and priced so you know exactly what you're paying from day one.</p>
<div style="margin-top: 40px; background: #0A0A0C; color: #FFFFFF; border-radius: 22px; padding: 30px; display: flex; gap: 22px; align-items: center">
<div style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 46px; line-height: 1; color: #A99BFF">1</div>
<div style="font-size: 16px; line-height: 1.55; color: #C9C9D1"><strong style="color: #FFFFFF">One service. One price.</strong> No confusing packages, no surprise upsells: a custom website for $800.</div>

</div>
</li>
</sc-for>

</div>

<h2 style="font-family: 'Space Grotesk', sans-serif; font-size: clamp(36px, 4.4vw, 58px); line-height: 1.04; letter-spacing: -0.03em; margin: 16px 0 0">From first call to launch, in four clear steps.</h2>

<!-- 8. RESULTS / BENEFITS -->

<div style="display: flex; flex-wrap: wrap; gap: 14px; margin-top: 32px">
